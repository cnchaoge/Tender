<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tender 使用说明</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4.13.0/lib/themes/vue.css">
  <style>
    /* Logo */
    .sidebar-toggle { display: none; }
    .sidebar { top: 0; }

    /* Brand header */
    .app-name-link { display: none; }
    
    /* Custom brand in sidebar */
    .sidebar-nav > p { 
      display: none; 
    }
    
    /* Search */
    #docsify-search-plugin { display: none; }

    /* Code blocks */
    pre { border-radius: 8px; }
    code { border-radius: 4px; }
  </style>
</head>
<body>
  <div id="app">加载中...</div>

  <script>
    window.$docsify = {
      name: 'Tender 使用说明',
      repo: 'https://github.com/cnchaoge/tender',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      notFoundPage: {
        '/': '404.md'
      },

      // 中文本地化
      search: {
        depth: 3,
        noData: '没有找到结果',
        placeholder: '搜索文档'
      },

      // 封面页
      coverpage: false,

      // 格式化
      formatUpdated: '{MM}/{DD} {HH}:{mm}',
      footer: {
        copy: '<span>Tender v1.0 MVP</span>',
        style: 'text-align: center; padding: 20px; border-top: 1px solid #eaecef; font-size: 13px; color: #999;'
      },

      // 插件
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: true
      },

      // 工具栏
      toolbar: [
        'prev',
        'next',
        'repo'
      ]
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4.13.0/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4.13.0/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2.10.0/dist/docsify-pagination.min.js"></script>
</body>
</html>
