name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}-${{ matrix.python-version }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        continue-on-error: true
        run: |
          ruff check .
      - name: Type check (mypy)
        continue-on-error: true
        run: |
          python -m mypy server --ignore-missing-imports
      - name: Run tests
        run: pytest -q --cov=server --cov-report=xml
      - name: Check coverage threshold
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          line_rate = root.attrib.get("line-rate")
          if not line_rate:
              print("coverage.xml missing line-rate")
              raise SystemExit(2)
          pct = float(line_rate) * 100
          print(f"Coverage: {pct:.2f}%")
          min_pct = 60.0
          if pct < min_pct:
              print(f"Coverage {pct:.2f}% below threshold {min_pct}%")
              raise SystemExit(3)
          PY
      - name: Upload coverage (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Production bundle keeps API calls on the page host
        working-directory: web
        run: |
          if grep -R "localhost:8000" dist; then
            echo "production bundle must not call localhost:8000"
            exit 1
          fi
          if grep -R "VITE_API_URL" dist; then
            echo "production bundle must not bake an absolute API host"
            exit 1
          fi
